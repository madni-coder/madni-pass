name: app
options:
  bundleIdPrefix: com.lazynotesApple.com
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.15.0
settingGroups:
  app:
    base:
      PRODUCT_NAME: Lazy Notes
      PRODUCT_BUNDLE_IDENTIFIER: com.lazynotesApple.com
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: app_iOS/GoogleService-Info.plist
        buildPhase: resources
    info:
      path: app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: "0.2.0"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.504994185739-bg3bbncjtel7rr79atm6bjnm9o3vpbso
              - com.googleusercontent.apps.504994185739-u1j476707tt5k18uifcevja1ifnh92hi
              - com.googleusercontent.apps.504994185739-7cf3da83hg0rdd7khfov6e0cmhl4k9pv
    entitlements:
      path: app_iOS/app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64, x86_64]
        VALID_ARCHS: arm64  x86_64 
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/$(CURRENT_ARCH)/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: $(inherited)
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "W5Q3VW5AX8"
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: AuthenticationServices.framework
      - package: Firebase
        product: FirebaseCore
    preBuildScripts:
      - script: |
          export PATH="/usr/local/bin:/Users/madniapple/.cargo/bin:$PATH"
          ARCHS="${ARCHS:-arm64}"
          if ! npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_preprocessor_definitions:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS}; then
            echo "tauri ios xcode-script failed. Checking if pre-compiled libapp.a exists..."
            for arch in ${ARCHS}; do
              LIB_PATH="${SRCROOT}/Externals/${arch}/${CONFIGURATION}/libapp.a"
              if [ -s "$LIB_PATH" ] && [ "$(wc -c < "$LIB_PATH")" -gt 100 ]; then
                echo "Found existing valid libapp.a at $LIB_PATH. Proceeding with existing library."
              else
                echo "Error: No valid libapp.a found at $LIB_PATH and xcode-script failed."
                exit 1
              fi
            done
          fi
          echo "Performing library surgery to remove duplicate FFI symbols..."
          for arch in ${ARCHS}; do
            echo "Processing architecture: ${arch}"
            if [ -d "${SRCROOT}/Externals/${arch}/${CONFIGURATION}" ]; then
              cd "${SRCROOT}/Externals/${arch}/${CONFIGURATION}" || continue
              if [ -f libapp.a ]; then
                echo "Before surgery size of libapp.a is:"
                ls -lh libapp.a
              else
                echo "Warning: libapp.a does not exist in $(pwd)!"
              fi
              mkdir -p temp_extract
              cd temp_extract || continue
              ar -x ../libapp.a
              rm -f ../libapp.a
              ar -rcs ../libapp.a *.o
              cd ..
              rm -rf temp_extract
            else
              echo "Directory for ${arch} does not exist, skipping library surgery."
            fi
          done
          echo "Library surgery completed!"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a