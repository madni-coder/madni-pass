name: app
options:
  bundleIdPrefix: com.lazynotesApple.com
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.15.0
settingGroups:
  app:
    base:
      PRODUCT_NAME: Lazy Notes
      PRODUCT_BUNDLE_IDENTIFIER: com.lazynotesApple.com
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: app_iOS/GoogleService-Info.plist
        buildPhase: resources
    info:
      path: app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: "0.2.0"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.504994185739-bg3bbncjtel7rr79atm6bjnm9o3vpbso
              - com.googleusercontent.apps.504994185739-u1j476707tt5k18uifcevja1ifnh92hi
              - com.googleusercontent.apps.504994185739-7cf3da83hg0rdd7khfov6e0cmhl4k9pv
    entitlements:
      path: app_iOS/app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/$(CURRENT_ARCH)/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: $(inherited)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "W5Q3VW5AX8"
      configs:
        debug:
          ARCHS: [arm64, x86_64]
          VALID_ARCHS: "arm64 x86_64"
          EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
          "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
        release:
          ARCHS: [arm64]
          VALID_ARCHS: "arm64"
          EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
          "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
          ONLY_ACTIVE_ARCH: "NO"
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: AuthenticationServices.framework
      - package: Firebase
        product: FirebaseCore
    preBuildScripts:
      - script: |
          export PATH="/usr/local/bin:/usr/bin:/bin:/Users/madniapple/.cargo/bin:$PATH"
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # SRCROOT = .../madni-pass/src-tauri/gen/apple  →  3 levels up = madni-pass/
          WEB_ROOT="$(cd "${SRCROOT}/../../.." && pwd)"

          echo "=== Building Next.js production bundle ==="
          echo "CONFIGURATION: ${CONFIGURATION}"
          echo "SRCROOT: ${SRCROOT}"
          echo "WEB_ROOT: ${WEB_ROOT}"

          cd "${WEB_ROOT}" || { echo "ERROR: Cannot cd to ${WEB_ROOT}"; exit 1; }

          # Find npm — try common locations
          NPM_BIN="$(which npm 2>/dev/null || echo '')"
          if [ -z "${NPM_BIN}" ]; then
            for p in /usr/local/bin/npm /opt/homebrew/bin/npm ~/.nvm/versions/node/*/bin/npm; do
              [ -f "$p" ] && NPM_BIN="$p" && break
            done
          fi
          echo "Using npm: ${NPM_BIN}"

          if [ "${CONFIGURATION}" = "release" ]; then
            echo "Release build — running npm run build..."
            "${NPM_BIN}" run build || { echo "ERROR: npm run build failed!"; exit 1; }
            echo "✅ Next.js build complete"
          else
            echo "Debug build — skipping npm run build (using existing out/)"
          fi

          echo "=== Copying web assets to Xcode project ==="
          ASSETS_DIR="${SRCROOT}/assets"
          OUT_DIR="${WEB_ROOT}/out"

          if [ -d "${OUT_DIR}" ]; then
            rm -rf "${ASSETS_DIR}"
            cp -R "${OUT_DIR}" "${ASSETS_DIR}"
            echo "✅ Copied ${OUT_DIR} → ${ASSETS_DIR}"
            echo "Assets count: $(find "${ASSETS_DIR}" | wc -l | tr -d ' ') files"
          else
            echo "ERROR: out/ not found at ${OUT_DIR} — did npm run build succeed?"
            exit 1
          fi
        name: Build Web Assets
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/assets
      - script: |
          export PATH="/usr/local/bin:/Users/madniapple/.cargo/bin:$PATH"
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          ARCHS="${ARCHS:-arm64}"

          # Find npm
          NPM_BIN="$(which npm 2>/dev/null || echo '')"
          if [ -z "${NPM_BIN}" ]; then
            for p in /usr/local/bin/npm /opt/homebrew/bin/npm ~/.nvm/versions/node/*/bin/npm; do
              [ -f "$p" ] && NPM_BIN="$p" && break
            done
          fi
          echo "Using npm: ${NPM_BIN}"

          if [ -z "${NPM_BIN}" ]; then
            echo "ERROR: npm not found! Cannot build Rust code."
            exit 1
          fi

          if ! "${NPM_BIN}" run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_preprocessor_definitions:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS}; then
            echo "tauri ios xcode-script failed. Checking if pre-compiled libapp.a exists..."
            BUILD_FAILED=0
            for arch in ${ARCHS}; do
              LIB_PATH="${SRCROOT}/Externals/${arch}/${CONFIGURATION}/libapp.a"
              LIB_SIZE=$(wc -c < "$LIB_PATH" 2>/dev/null || echo 0)
              if [ -s "$LIB_PATH" ] && [ "$LIB_SIZE" -gt 1000 ]; then
                echo "✅ Found existing valid libapp.a for ${arch} (${LIB_SIZE} bytes). Using it."
              else
                echo "❌ No valid libapp.a for ${arch} at $LIB_PATH"
                BUILD_FAILED=1
              fi
            done
            if [ "$BUILD_FAILED" -eq 1 ]; then
              echo "======================================================================"
              echo "❌ FATAL: Rust build failed and no pre-compiled library found!"
              echo "Please run this FIRST in terminal before archiving:"
              echo "  npm run ios:release"
              echo "======================================================================"
              exit 1
            fi
          fi

          echo "Performing library surgery to remove duplicate FFI symbols..."
          for arch in ${ARCHS}; do
            echo "Processing architecture: ${arch}"
            LIB_DIR="${SRCROOT}/Externals/${arch}/${CONFIGURATION}"
            if [ -d "${LIB_DIR}" ] && [ -f "${LIB_DIR}/libapp.a" ]; then
              LIB_SIZE=$(wc -c < "${LIB_DIR}/libapp.a")
              echo "libapp.a size: ${LIB_SIZE} bytes"
              if [ "$LIB_SIZE" -lt 1000 ]; then
                echo "Warning: libapp.a for ${arch} is too small (${LIB_SIZE} bytes), skipping surgery."
                continue
              fi
              cd "${LIB_DIR}" || continue
              mkdir -p temp_extract
              cd temp_extract || continue
              ar -x ../libapp.a
              rm -f ../libapp.a
              ar -rcs ../libapp.a *.o
              cd ..
              rm -rf temp_extract
              echo "✅ Library surgery done for ${arch}"
            else
              echo "Directory/library for ${arch} does not exist, skipping."
            fi
          done
          echo "Library surgery completed!"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a